# One-command production stack:  docker compose up -d --build
#   app    the website and back office
#   mongo  database (not reachable from outside; data kept in a volume)
#   caddy  HTTPS certificates (Let's Encrypt) and the public front door
# Copy .env.production.example to .env and fill it in first.
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/auto_marketplace
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env (e.g. cars.example.pk)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  mongo-data:
  uploads:
  caddy-data:
